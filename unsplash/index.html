<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        .bg-wrap {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
        }

        .bg-wrap img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: opacity 1.5s ease-in-out;
        }

        #bg-back { z-index: 0; }
        #bg-front { z-index: 1; opacity: 0; }

        body {
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background: #111;
        }

        .container {
            position: relative;
            z-index: 2;
            background: rgba(255,255,255,0.28);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 { margin-bottom: 1.5rem; color: #333; }
        .form-group { margin-bottom: 1rem; }
        input[type="text"] { width: 100%; padding: 0.75rem; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; }
        input[type="text"]:focus { outline: none; border-color: #3b82f6; }
        #qr-box {
            position: relative;
            margin: 1.5rem auto;
            padding: 1.25rem;
            border-radius: 12px;
            min-height: 168px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: white;
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
        }
        #qr-svg { transition: opacity 300ms ease-in-out; width: 100%; }
        #qr-svg svg { width: 100%; height: auto; max-height: 70vh; }
        #qr-svg.hidden { opacity: 0; }
        .slider-box {
            margin: 1.5rem auto 0;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            box-sizing: border-box;
            width: 100%;
        }
        .slider-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: #333;
            font-weight: 500;
        }
        .slider-box input[type="range"] {
            width: 100%;
            accent-color: #3b82f6;
            cursor: pointer;
        }
        .slider-value {
            margin-top: 0.4rem;
            font-size: 0.9rem;
            color: #333;
        }
        .custom-box {
            margin: 1rem auto 0;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            box-sizing: border-box;
            width: 100%;
        }
        .custom-title {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: #333;
            font-weight: 500;
        }
        .custom-row {
            display: flex;
            gap: 0.5rem;
        }
        .custom-row input[type="number"] {
            flex: 1;
            width: 100%;
            padding: 0.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            min-width: 0;
        }
        .custom-row input[type="number"]:focus { outline: none; border-color: #3b82f6; }
        .btn-sm {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .btn-sm:hover { background: #2563eb; }
        .btn { background: #3b82f6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="bg-wrap">
        <img id="bg-back" alt="">
        <img id="bg-front" alt="">
    </div>

    <div class="container">
        <h1>QR Code Generator</h1>

        <form id="qr-form">
            <div class="form-group">
                <input type="text" id="qr-input" placeholder="Enter text or URL..." autofocus>
            </div>
            <button type="submit" class="btn">Generate QR</button>
        </form>

        <div id="qr-box">
        </div>

        <div class="slider-box">
            <label class="slider-label" for="qr-slider">Значение</label>
            <input type="range" id="qr-slider" min="0" max="1000" value="500">
            <div class="slider-value" id="slider-value">500</div>
        </div>

        <div class="custom-box">
            <label class="custom-title" for="custom-input">Указать свой вариант</label>
            <div class="custom-row">
                <input type="number" id="custom-input" min="0" max="1000">
                <button type="button" class="btn-sm" id="custom-ok">OK</button>
            </div>
        </div>
    </div>

    <script>
        var bgBack = document.getElementById('bg-back');
        var bgFront = document.getElementById('bg-front');
        var bgBusy = false;
        var DISPLAY_MS = 6000;

        function fetchNextBg() {
            if (bgBusy) return;
            bgBusy = true;
            bgFront.src = '/api/next-background?t=' + Date.now();
        }

        bgFront.addEventListener('load', function() {
            bgFront.style.opacity = '1';
        });

        bgFront.addEventListener('transitionend', function(e) {
            if (e.propertyName !== 'opacity') return;
            if (bgFront.style.opacity === '1') {
                setTimeout(function() {
                    bgBack.src = bgFront.src;
                    bgFront.style.opacity = '0';
                }, DISPLAY_MS);
            } else {
                bgBusy = false;
                setTimeout(fetchNextBg, 300);
            }
        });

        bgFront.addEventListener('error', function() {
            bgBusy = false;
        });

        fetchNextBg();

        var form = document.getElementById('qr-form');
        var input = document.getElementById('qr-input');
        var box = document.getElementById('qr-box');

        var ECL = ['L', 'M', 'Q', 'H'];
        var COUNTDOWN_DIGITS = ['05', '04', '03', '02', '01', '00'];
        var DUR_PER_DIGIT = 1000;
        var FADE_MS = 300;

        var idx = 0;
        var cycleTimer = null;
        var countdownTimer = null;
        var text = '';

        var SVG_NS = 'http://www.w3.org/2000/svg';

        function makeQR(str, ecl) {
            var qr = qrcode(0, ecl);
            qr.addData(str);
            qr.make();
            return qr.createSvgTag(6, 0);
        }

        function addCountdown(svgNode) {
            var txt = document.createElementNS(SVG_NS, 'text');
            txt.setAttribute('x', 21);
            txt.setAttribute('y', 21);
            txt.setAttribute('text-anchor', 'middle');
            txt.setAttribute('dominant-baseline', 'central');
            txt.setAttribute('font-family', 'monospace, sans-serif');
            txt.setAttribute('font-size', 10);
            txt.setAttribute('font-weight', 'bold');
            txt.setAttribute('fill', 'white');
            txt.id = 'countdown-text';
            txt.textContent = '05';
            svgNode.appendChild(txt);
        }

        function setQR(str, ecl) {
            var tmp = document.createElement('div');
            tmp.innerHTML = makeQR(str, ecl);
            var svgNode = tmp.firstChild;
            svgNode.removeAttribute('width');
            svgNode.removeAttribute('height');
            addCountdown(svgNode);

            var wrapper = box.querySelector('#qr-svg');

            if (!wrapper) {
                wrapper = document.createElement('div');
                wrapper.id = 'qr-svg';
                wrapper.className = 'hidden';
                box.appendChild(wrapper);
            }
            wrapper.innerHTML = '';
            wrapper.appendChild(svgNode);
        }

        function cycle() {
            setQR(text, ECL[idx]);
            var wrapper = box.querySelector('#qr-svg');

            wrapper.classList.add('hidden');
            void wrapper.offsetHeight;
            wrapper.classList.remove('hidden');

            var count = 0;
            var txt = box.querySelector('#countdown-text');

            function tick() {
                if (txt) txt.textContent = COUNTDOWN_DIGITS[count];
                count++;

                if (count >= COUNTDOWN_DIGITS.length) {
                    countdownTimer = setTimeout(function() {
                        wrapper.classList.add('hidden');
                        cycleTimer = setTimeout(function() {
                            idx = (idx + 1) % ECL.length;
                            cycle();
                        }, FADE_MS);
                    }, DUR_PER_DIGIT - FADE_MS);
                } else {
                    countdownTimer = setTimeout(tick, DUR_PER_DIGIT);
                }
            }

            tick();
        }

        function stopCycle() {
            if (cycleTimer) { clearTimeout(cycleTimer); cycleTimer = null; }
            if (countdownTimer) { clearTimeout(countdownTimer); countdownTimer = null; }
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            var val = input.value.trim();
            if (!val) return;

            text = val;
            idx = 0;
            stopCycle();

            var wrapper = box.querySelector('#qr-svg');
            if (wrapper) {
                wrapper.style.transition = 'none';
                wrapper.classList.add('hidden');
                void wrapper.offsetHeight;
                wrapper.style.transition = '';
            }

            cycle();
        });

        var slider = document.getElementById('qr-slider');
        var sliderValue = document.getElementById('slider-value');
        slider.addEventListener('input', function() {
            sliderValue.textContent = slider.value;
        });

        var customInput = document.getElementById('custom-input');
        var customOk = document.getElementById('custom-ok');
        function applyCustom() {
            var v = parseInt(customInput.value, 10);
            if (isNaN(v)) return;
            if (v < 0) v = 0;
            if (v > 1000) v = 1000;
            slider.value = v;
            sliderValue.textContent = v;
        }
        customOk.addEventListener('click', applyCustom);
        customInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') applyCustom();
        });
    </script>
</body>
</html>
