<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        .bg-wrap {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
        }

        .bg-wrap img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: opacity 1.5s ease-in-out;
        }

        #bg-back { z-index: 0; }
        #bg-front { z-index: 1; opacity: 0; }

        body {
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background: #111;
        }

        .container {
            position: relative;
            z-index: 2;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(12px);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 { margin-bottom: 1.5rem; color: #333; }
        .form-group { margin-bottom: 1rem; }
        input[type="text"] { width: 100%; padding: 0.75rem; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; }
        input[type="text"]:focus { outline: none; border-color: #3b82f6; }
        #qr-box { position: relative; margin: 1.5rem auto; padding: 1rem; background: white; border: 2px dashed #e0e0e0; border-radius: 8px; min-height: 128px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #qr-box.has-qr { border-style: solid; }
        #qr-svg { transition: opacity 300ms ease-in-out; width: 100%; position: relative; }
        #qr-svg svg { width: 100%; height: auto; max-height: 70vh; display: block; }
        #qr-svg.hidden { opacity: 0; }
        .btn { background: #3b82f6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .btn:hover { background: #2563eb; }
        .hint { color: #888; font-size: 0.85rem; margin-top: 0.5rem; }
        .ecl-label { color: #888; font-size: 0.8rem; margin-top: 0.4rem; }
    </style>
</head>
<body>
    <div class="bg-wrap">
        <img id="bg-back" src="" alt="">
        <img id="bg-front" src="" alt="">
    </div>

    <div class="container">
        <h1>QR Code Generator</h1>

        <form id="qr-form">
            <div class="form-group">
                <input type="text" id="qr-input" placeholder="Enter text or URL..." autofocus>
            </div>
            <button type="submit" class="btn">Generate QR</button>
        </form>

        <div id="qr-box">
            <p class="hint">Your QR code will appear here</p>
        </div>
    </div>

    <script>
        var bgBack = document.getElementById('bg-back');
        var bgFront = document.getElementById('bg-front');
        var bgBusy = false;
        var DISPLAY_MS = 6000;

        function fetchNextBg() {
            if (bgBusy) return;
            bgBusy = true;
            bgFront.src = '/api/next-background?t=' + Date.now();
        }

        bgFront.addEventListener('load', function() {
            bgFront.style.opacity = '1';
        });

        bgFront.addEventListener('transitionend', function(e) {
            if (e.propertyName !== 'opacity') return;
            if (bgFront.style.opacity === '1') {
                setTimeout(function() {
                    bgBack.src = bgFront.src;
                    bgFront.style.opacity = '0';
                }, DISPLAY_MS);
            } else {
                bgBusy = false;
                setTimeout(fetchNextBg, 300);
            }
        });

        bgFront.addEventListener('error', function() {
            bgBusy = false;
        });

        fetchNextBg();

        var form = document.getElementById('qr-form');
        var input = document.getElementById('qr-input');
        var box = document.getElementById('qr-box');

        var ECL = ['L', 'M', 'Q', 'H'];
        var COUNTDOWN_DIGITS = ['05', '04', '03', '02', '01', '00'];
        var DUR_PER_DIGIT = 1000;
        var FADE_MS = 300;

        var idx = 0;
        var cycleTimer = null;
        var countdownTimer = null;
        var text = '';

        var SVG_NS = 'http://www.w3.org/2000/svg';

        function makeQR(str, ecl) {
            var qr = qrcode(0, ecl);
            qr.addData(str);
            qr.make();
            return qr.createSvgTag(6, 0);
        }

        function addCountdown(svgNode) {
            var txt = document.createElementNS(SVG_NS, 'text');
            txt.setAttribute('x', 21);
            txt.setAttribute('y', 21);
            txt.setAttribute('text-anchor', 'middle');
            txt.setAttribute('dominant-baseline', 'central');
            txt.setAttribute('font-family', 'monospace, sans-serif');
            txt.setAttribute('font-size', 10);
            txt.setAttribute('font-weight', 'bold');
            txt.setAttribute('fill', 'white');
            txt.id = 'countdown-text';
            txt.textContent = '05';
            svgNode.appendChild(txt);
        }

        function setQR(str, ecl) {
            var tmp = document.createElement('div');
            tmp.innerHTML = makeQR(str, ecl);
            var svgNode = tmp.firstChild;
            svgNode.removeAttribute('width');
            svgNode.removeAttribute('height');
            addCountdown(svgNode);

            var wrapper = box.querySelector('#qr-svg');
            var lbl = box.querySelector('.ecl-label');

            if (!wrapper) {
                wrapper = document.createElement('div');
                wrapper.id = 'qr-svg';
                wrapper.className = 'hidden';
                box.appendChild(wrapper);
            }
            wrapper.innerHTML = '';
            wrapper.appendChild(svgNode);

            if (!lbl) {
                lbl = document.createElement('div');
                lbl.className = 'ecl-label';
                box.appendChild(lbl);
            }
            lbl.textContent = 'ECL: ' + ecl;
        }

        function cycle() {
            setQR(text, ECL[idx]);
            var wrapper = box.querySelector('#qr-svg');

            wrapper.classList.add('hidden');
            void wrapper.offsetHeight;
            wrapper.classList.remove('hidden');

            var count = 0;
            var txt = box.querySelector('#countdown-text');

            function tick() {
                if (txt) txt.textContent = COUNTDOWN_DIGITS[count];
                count++;

                if (count >= COUNTDOWN_DIGITS.length) {
                    countdownTimer = setTimeout(function() {
                        wrapper.classList.add('hidden');
                        cycleTimer = setTimeout(function() {
                            idx = (idx + 1) % ECL.length;
                            cycle();
                        }, FADE_MS);
                    }, DUR_PER_DIGIT - FADE_MS);
                } else {
                    countdownTimer = setTimeout(tick, DUR_PER_DIGIT);
                }
            }

            tick();
        }

        function stopCycle() {
            if (cycleTimer) { clearTimeout(cycleTimer); cycleTimer = null; }
            if (countdownTimer) { clearTimeout(countdownTimer); countdownTimer = null; }
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            var val = input.value.trim();
            if (!val) return;

            text = val;
            idx = 0;
            stopCycle();
            box.classList.add('has-qr');

            var wrapper = box.querySelector('#qr-svg');
            if (wrapper) {
                wrapper.style.transition = 'none';
                wrapper.classList.add('hidden');
                void wrapper.offsetHeight;
                wrapper.style.transition = '';
            }

            cycle();
        });
    </script>
</body>
</html>
